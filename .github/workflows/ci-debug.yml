name: CI Debug (toolchain diagnostics, scratch)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/ci-debug.yml' ]

env:
  BUILD_TYPE: Release

jobs:
  debug-ubuntu-aptllvm:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    name: Debug / ubuntu-24.04 / apt.llvm.org-19
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: lukka/get-cmake@28983e0d3955dba2bb0a6810caae0c6cf268ec0c # latest
      - name: Install LLVM 19 (apt.llvm.org) and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev wget gnupg
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update
          sudo apt-get install -y llvm-19-dev libpolly-19-dev libzstd-dev
      - name: Configure
        run: |
          cmake -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_PREFIX_PATH="/usr/lib/x86_64-linux-gnu" -DADEPT_LINK_LLVM_STATIC=On -B ${{github.workspace}}/build -G Ninja
        env:
          LLVM_DIR: /usr/lib/llvm-19
          zstd_DIR: /usr/lib/x86_64-linux-gnu/cmake
      - name: Build
        run: cmake --build ${{github.workspace}}/build --config $BUILD_TYPE
      - name: Smoke test (compile + execute stdlib program)
        working-directory: ${{github.workspace}}/tests/e2e
        run: |
          set +e
          ../../build/adept --version | tail -3; echo "version_exit=$?"
          ../../build/adept src/anonymous_enums/main.adept -e; echo "e_exit=$?"
      - name: Full E2E suite
        working-directory: ${{github.workspace}}/tests/e2e
        run: |
          python3 e2e-runner.py ../../build/adept; echo "e2e_exit=$?"

  debug-windows-staticcxx:
    runs-on: windows-2022
    timeout-minutes: 30
    name: Debug / windows-2022 / static-cpp
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: msys2/setup-msys2@61f9e5e925871ba6c9e3e8da24ede83ea27fa91f # v2
        with:
          msystem: mingw64
          update: true
          install: git mingw-w64-x86_64-gcc
      - name: Setup MSYS2
        shell: msys2 {0}
        run: |
          pacman -S mingw-w64-x86_64-cmake --noconfirm
          pacman -S mingw-w64-x86_64-ninja --noconfirm
          pacman -S mingw-w64-x86_64-gcc --noconfirm
          pacman -S mingw-w64-x86_64-llvm --noconfirm
          pacman -S mingw-w64-x86_64-zlib --noconfirm
          pacman -S mingw-w64-x86_64-zstd --noconfirm
          pacman -S mingw-w64-x86_64-curl --noconfirm
          echo 'Dependencies installed successfully'
      - name: Configure (Windows, static libgcc/libstdc++)
        shell: msys2 {0}
        run: |
          cmake -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DADEPT_LINK_LLVM_STATIC=On -B "${{github.workspace}}/build" -G Ninja
        env:
          LLVM_DIR: ${{github.workspace}}/llvm/llvm/build
          zstd_DIR: C:\msys64\mingw64
          zstd_LIBRARY: C:\msys64\mingw64\lib\libzstd.a
          ZLIB_INCLUDE_DIR: C:\msys64\mingw64\include
          ZLIB_LIBRARY: C:\msys64\mingw64\lib\libz.a
          CFLAGS: -static-libgcc
          CXXFLAGS: -static-libgcc -static-libstdc++
          LDFLAGS: -static-libgcc -static-libstdc++
      - name: Build (Windows)
        shell: msys2 {0}
        run: |
          cmake --build "${{github.workspace}}/build" --config $BUILD_TYPE
      - name: Unit Test (curl DLLs only)
        shell: bash
        run: |
          set +e
          cp build/libcurl-4.dll build/libcrypto-3-x64.dll build/libssl-3-x64.dll build/libnghttp2-14.dll build/libssh2-1.dll build/libpsl-5.dll build/libbrotlidec.dll build/libbrotlicommon.dll build/zlib1.dll build/libidn2-0.dll build/libunistring-5.dll build/libiconv-2.dll build/libintl-8.dll build/libnghttp3-9.dll build/libzstd.dll build/tests/unit/ 2>/dev/null
          build/tests/unit/UnitTestRunner.exe; echo "unit_static_exit=$?"
      - name: Adept smoke (compile + execute)
        shell: bash
        working-directory: ${{github.workspace}}/tests/e2e
        run: |
          set +e
          ../build/adept src/anonymous_enums/main.adept -o t1.exe; echo "compile_exit=$?"
          ./t1.exe; echo "run_exit=$?"
