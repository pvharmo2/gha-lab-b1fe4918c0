name: CI Debug (toolchain diagnostics, scratch)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/ci-debug.yml' ]

env:
  BUILD_TYPE: Release

jobs:
  debug-ubuntu:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [llvm19-gcc, llvm19-clang]
    name: Debug / ubuntu-24.04 / ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: lukka/get-cmake@28983e0d3955dba2bb0a6810caae0c6cf268ec0c # latest
      - name: Install LLVM and dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev file
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install zstd
          brew install llvm@19
          brew ls -v zstd
      - name: Configure
        run: |
          cmake -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_PREFIX_PATH="/usr/lib/x86_64-linux-gnu" -DADEPT_LINK_LLVM_STATIC=On -B ${{github.workspace}}/build -G Ninja
        env:
          LLVM_DIR: /home/linuxbrew/.linuxbrew/opt/llvm@19
          zstd_DIR: /home/linuxbrew/.linuxbrew/opt/zstd
          CC: ${{ matrix.variant == 'llvm19-gcc' && 'gcc' || '/home/linuxbrew/.linuxbrew/opt/llvm@19/bin/clang' }}
          CXX: ${{ matrix.variant == 'llvm19-gcc' && 'g++' || '/home/linuxbrew/.linuxbrew/opt/llvm@19/bin/clang++' }}
      - name: Build
        run: cmake --build ${{github.workspace}}/build --config $BUILD_TYPE
      - name: Smoke test (compile + execute stdlib program)
        working-directory: ${{github.workspace}}/tests/e2e
        run: |
          set +e
          pwd
          ls -la ../../build/adept 2>&1
          ../../build/adept --version | tail -3; echo "version_exit=$?"
          ../../build/adept src/anonymous_enums/main.adept -e; echo "e_exit=$?"

  debug-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    name: Debug / windows-2022
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: msys2/setup-msys2@61f9e5e925871ba6c9e3e8da24ede83ea27fa91f # v2
        with:
          msystem: mingw64
          update: true
          install: git mingw-w64-x86_64-gcc
      - name: Setup MSYS2
        shell: msys2 {0}
        run: |
          pacman -S mingw-w64-x86_64-cmake --noconfirm
          pacman -S mingw-w64-x86_64-ninja --noconfirm
          pacman -S mingw-w64-x86_64-gcc --noconfirm
          pacman -S mingw-w64-x86_64-llvm --noconfirm
          pacman -S mingw-w64-x86_64-zlib --noconfirm
          pacman -S mingw-w64-x86_64-zstd --noconfirm
          pacman -S mingw-w64-x86_64-curl --noconfirm
          echo 'Dependencies installed successfully'
      - name: Configure (Windows)
        shell: msys2 {0}
        run: |
          cmake -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DADEPT_LINK_LLVM_STATIC=On -B "${{github.workspace}}/build" -G Ninja
        env:
          LLVM_DIR: ${{github.workspace}}/llvm/llvm/build
          zstd_DIR: C:\msys64\mingw64
          zstd_LIBRARY: C:\msys64\mingw64\lib\libzstd.a
          ZLIB_INCLUDE_DIR: C:\msys64\mingw64\include
          ZLIB_LIBRARY: C:\msys64\mingw64\lib\libz.a
      - name: Build (Windows)
        shell: msys2 {0}
        run: |
          cmake --build "${{github.workspace}}/build" --config $BUILD_TYPE
      - name: Unit Test (era DLLs, control)
        shell: bash
        run: |
          build/tests/unit/UnitTestRunner.exe; echo "unit_era_dlls_exit=$?"
      - name: Unit Test (current msys2 DLLs)
        shell: bash
        run: |
          set -x
          cp /c/msys64/mingw64/bin/libstdc++-6.dll /c/msys64/mingw64/bin/libgcc_s_seh-1.dll /c/msys64/mingw64/bin/libwinpthread-1.dll /c/msys64/mingw64/bin/libcurl-4.dll /c/msys64/mingw64/bin/zlib1.dll /c/msys64/mingw64/bin/libzstd.dll /c/msys64/mingw64/bin/libcrypto-3-x64.dll /c/msys64/mingw64/bin/libssl-3-x64.dll /c/msys64/mingw64/bin/libssh2-1.dll /c/msys64/mingw64/bin/libnghttp2-14.dll /c/msys64/mingw64/bin/libpsl-5.dll /c/msys64/mingw64/bin/libbrotlidec.dll /c/msys64/mingw64/bin/libbrotlicommon.dll /c/msys64/mingw64/bin/libidn2-0.dll /c/msys64/mingw64/bin/libunistring-5.dll /c/msys64/mingw64/bin/libiconv-2.dll /c/msys64/mingw64/bin/libintl-8.dll build/tests/unit/
          build/tests/unit/UnitTestRunner.exe; echo "unit_msys2_dlls_exit=$?"
      - name: Adept smoke (compile + execute)
        shell: bash
        working-directory: ${{github.workspace}}/tests/e2e
        run: |
          set -x
          ../build/adept src/anonymous_enums/main.adept -o t1.exe; echo "compile_exit=$?"
          ./t1.exe; echo "run_exit=$?"
